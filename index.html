<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPUNGG SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05020f;--border:rgba(155,48,255,0.3);--purple:#9b30ff;--neon:#00f5ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:white;font-family:'Rajdhani',sans-serif}
.navbar{height:60px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;position:sticky;top:0;background:rgba(10,5,25,0.6);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.logo{font-family:'Orbitron';color:var(--neon);display:flex;gap:6px;align-items:center}
.hamburger{font-size:24px;background:none;border:none;color:var(--neon)}
.side-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);opacity:0;pointer-events:none;transition:.3s;z-index:2000}
.side-overlay.open{opacity:1;pointer-events:auto}
.side-menu{position:fixed;right:-300px;top:0;width:260px;height:100vh;background:#0a0520;padding:20px;transition:.3s;z-index:3000}
.side-menu.open{right:0}
.side-head{display:flex;gap:6px;font-family:'Orbitron';color:var(--neon);margin-bottom:10px}
.side-link{display:block;padding:12px;margin-top:10px;border-radius:10px;background:rgba(255,255,255,0.05);color:white;text-decoration:none}
.banner-wrap img,.banner-wrap video{width:95%;margin:10px auto;display:block;border-radius:16px;max-height:160px;object-fit:cover}
.cat-cards{display:flex;gap:10px;overflow:auto;padding:10px}
.cat-card{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,0.05);border:1px solid var(--border);white-space:nowrap;cursor:pointer}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.product-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative}
.prod-thumb{width:100%;aspect-ratio:1;object-fit:contain;background:#0a0520;padding:8px}
.prod-info{padding:10px}
.pin{position:absolute;top:8px;left:8px;background:gold;color:black;font-size:11px;padding:3px 7px;border-radius:999px}
.btn{width:100%;margin-top:10px;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--neon));color:white;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:5000}
.overlay.show{display:flex}
.box{background:#0a0520;padding:20px;border-radius:16px;width:90%;max-width:400px;position:relative}
.close{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:none;background:red;color:white;cursor:pointer}
.input{width:100%;padding:10px;margin-top:10px;border-radius:10px;border:1px solid var(--border);background:#0b0515;color:white}
.qris{width:180px;display:block;margin:10px auto;border-radius:12px}
.download{display:block;text-align:center;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--border);color:white;text-decoration:none}
.copyright{text-align:center;padding:30px 10px;margin-top:80px;font-family:'Orbitron',sans-serif;font-size:14px;color:#b07cff;position:relative;text-shadow:0 0 6px rgba(155,48,255,0.6),0 0 12px rgba(155,48,255,0.4);animation:floatSoft 4s ease-in-out infinite}
.copyright::before{content:"";position:absolute;left:50%;top:50%;width:170px;height:170px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(70,0,110,0.4),transparent 70%);filter:blur(18px);z-index:-1}
@keyframes floatSoft{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">🛒 IPUNGG SHOP</div>
  <button class="hamburger" onclick="toggleMenu()">☰</button>
</nav>

<div class="side-overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="side-menu" id="menu">
  <div class="side-head">🛍️ IPUNGG SHOP</div>
  <a class="side-link" id="wa">💬 WhatsApp Admin</a>
  <a class="side-link" id="group">👥 Group Bot Comunity</a>
  <a class="side-link" id="channel">📢 Channel Official Ipungg</a>
</div>

<div class="banner-wrap" id="banner"></div>
<div class="cat-cards" id="cats"></div>
<div class="products-grid" id="products"></div>
<div class="copyright">© IPUNGG X MEZUKI</div>

<div class="overlay" id="orderBox">
  <div class="box">
    <button class="close" onclick="closeAll()">×</button>
    <h3>🛒 ORDER</h3>
    <div id="pname"></div><div id="pprice"></div>
    <input class="input" id="name" placeholder="Nama Anda">
    <button class="btn" onclick="nextPay()">LANJUT PAYMENT</button>
  </div>
</div>

<div class="overlay" id="payBox">
  <div class="box">
    <button class="close" onclick="closeAll()">×</button>
    <h3>💳 QRIS</h3>
    <img id="qrisImg" class="qris">
    <a id="downloadQris" class="download" download>⬇ Download QRIS</a>
    <input type="file" id="proof" class="input">
    <button class="btn" onclick="send()">KIRIM ADMIN</button>
  </div>
</div>

<script>
!function(){
  // XOR decoder
  var _xd=function(e,k){
    var b=atob(e),o="";
    for(var i=0;i<b.length;i++) o+=String.fromCharCode(b.charCodeAt(i)^k.charCodeAt(i%k.length));
    return o;
  };

  // XOR key — dipecah 2 bagian
  var _k=atob("aXB1bmc=")+atob("Z3Nob3A="); // ipunggshop

  // Firebase apiKey — XOR encoded (verified)
  var _ak=_xd("KDkPDzQeMlE7IwwYEhY=",_k);

  // projectId — 3 chunk
  var _p=[atob("aXB1bmc="),atob("LXN0b3Jl"),atob("LTJiOTZk")].join("");

  // authDomain
  var _ad=_p+atob("LmZpcmViYXNlYXBwLmNvbQ==");

  // databaseURL — 4 chunk
  var _du=[
    atob("aHR0cHM6Ly9pcHVuZw=="),
    atob("LXN0b3Jl"),
    atob("LTJiOTZkLWRlZmF1bHQtcnRkYg=="),
    atob("LmFzaWEtc291dGhlYXN0MS5maXJlYmFzZWRhdGFiYXNlLmFwcA==")
  ].join("");

  // ImgBB key — XOR encoded (verified correct)
  var _ik=_xd("CEgUWgNSRg5XSFAWFg8DA0pdWkVbQkRaA1JGC1tGC0M=",_k);

  window.__Z={k:_ak,p:_p,a:_ad,d:_du,i:_ik};
}();
</script>

<script type="module">
// Firebase SDK URL — dipecah array chunk
const _u1=[
  "aHR0cHM6Ly93d3cu","Z3N0YXRpYy5jb20v","ZmlyZWJhc2Vqcy8x","MC4xMi4yL2ZpcmVi","YXNlLWFwcC5qcw=="
].map(atob).join("");

const _u2=[
  "aHR0cHM6Ly93d3cu","Z3N0YXRpYy5jb20v","ZmlyZWJhc2Vqcy8x","MC4xMi4yL2ZpcmVi","YXNlLWRhdGFiYXNlLmpz"
].map(atob).join("");

const{initializeApp}=await import(_u1);
const{getDatabase,ref,onValue}=await import(_u2);

const _app=initializeApp({
  apiKey     :window.__Z.k,
  authDomain :window.__Z.a,
  databaseURL:window.__Z.d,
  projectId  :window.__Z.p
});
const _db=getDatabase(_app);

const _rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n);
const _g=id=>document.getElementById(id);

let _st={},_sl={},_ac="all";

onValue(ref(_db,"store"),snap=>{
  _st=snap.val()||{settings:{},products:{},categories:{}};
  _draw();
});

function _draw(){
  const s=_st.settings||{};
  _g("wa").href="https://wa.me/"+(s.urlAdmin||"");
  _g("group").href=s.urlGroup||"#";
  _g("channel").href=s.urlChannel||"#";

  _g("banner").innerHTML=s.banner?.includes(".mp4")
    ?`<video autoplay muted loop src="${s.banner}"></video>`
    :`<img src="${s.banner}">`;

  const q=s.qrisUrl||"https://img2.pixhost.to/images/7838/725233706_elaina-1778564710301.jpg";
  _g("qrisImg").src=q;_g("downloadQris").href=q;

  const cats=Object.values(_st.categories||{});
  _g("cats").innerHTML=`<div class="cat-card" onclick="_fc('all')">ALL</div>`
    +cats.map(c=>`<div class="cat-card" onclick="_fc('${c.name}')">${c.name}</div>`).join("");

  const all=Object.values(_st.products||{});
  const p=_ac==="all"?all.filter(x=>x.pinned):all.filter(x=>x.category==_ac);
  _g("products").innerHTML=p.map(x=>`<div class="product-card">
    ${x.pinned?`<div class="pin">PIN</div>`:""}
    <img class="prod-thumb" src="${x.thumbnail}">
    <div class="prod-info">
      <div>${x.name}</div><div>${_rp(x.price)}</div>
      <button class="btn" onclick='_od(${JSON.stringify(x)})'>ORDER 💖</button>
    </div></div>`).join("");
}

window.send=async()=>{
  try{
    const file=_g("proof").files[0];
    if(!file){alert("Pilih bukti transfer dulu!");return;}

    const fd=new FormData();
    fd.append("image",file);

    // ImgBB endpoint — dipecah chunk
    const _ep=[
      atob("aHR0cHM6Ly9hcGku"),
      atob("aW1nYmIuY29tLzEv"),
      atob("dXBsb2Fk")
    ].join("");

    const res=await fetch(`${_ep}?key=${window.__Z.i}`,{method:"POST",body:fd});
    const j=await res.json();

    if(!j?.data?.url){
      alert("Upload gagal, coba lagi!");
      console.error(j);
      return;
    }

    const img=j.data.url;
    const nm=_g("name").value||"-";
    const msg=encodeURIComponent(
`*📝 FORMAT ORDER PRODUK IPUNGG*

*👤 Nama* : ${nm}
*🛒 Produk* : ${_sl.name}
*💰 Harga* : ${_rp(_sl.price)}
*📸 Bukti pembayaran*
${img}

💌 Mohon diproses ya admin 😘`);

    window.open("https://wa.me/"+(_st.settings.urlAdmin||"")+"?text="+msg);
    closeAll();
  }catch(e){
    alert("Error: "+e.message);
    console.error(e);
  }
};

window._fc      =c=>{_ac=c;_draw();};
window._od      =p=>{_sl=p;_g("pname").innerText=p.name;_g("pprice").innerText=_rp(p.price);_g("orderBox").classList.add("show");};
window.toggleMenu=()=>{_g("menu").classList.toggle("open");_g("overlay").classList.toggle("open");};
window.nextPay  =()=>{_g("orderBox").classList.remove("show");_g("payBox").classList.add("show");};
window.closeAll =()=>{_g("orderBox").classList.remove("show");_g("payBox").classList.remove("show");};
</script>

</body>
</html>
